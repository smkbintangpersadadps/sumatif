<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Main Menu</title>
  <!-- BOOTSTRAP -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- ICON -->
  <link rel="icon" type="image/png" href="https://i.ibb.co.com/sdV75wcH/Logo.png">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <!-- CSS KAMU -->
  <link rel="stylesheet" href="style_menu.css">

</head>

<body>

<div class="page" id="mainPage" style="display:none;">
  <div class="main">
    <div class="wrap">

      <!-- HEADER -->
      <div class="brand">
        <img class="logo" src="https://i.ibb.co.com/sdV75wcH/Logo.png">
        <div>
          <h1 class="title">SAS 2026</h1>
          <div class="subtitle">SMK Bintang Persada Denpasar</div>
        </div>
      </div>

      <div class="hero">
        <h2>Dashboard SAS 2026</h2>
        <p>Pilih menu di bawah untuk melanjutkan.</p>
      </div>

      <!-- CARD -->
      <div class="card">
        <div class="card-head">
          <h3>Menu Utama</h3>
          <span class="badge-soft">Quick Access</span>
        </div>

        <div class="card-body">

          <!-- SISWA -->
          <div class="group group-paket1">
            <button type="button" class="group-btn caret">
              <span class="left">
                <span class="icon">S</span>
                SISWA
              </span>
              <span class="chev">▾</span>
            </button>

            <div class="group-menu nested">
              <div class="menu-grid">
                <a class="menu-link" href="/sumatif/kartu_ujian">Kartu Ujian<span>→</span></a>
              </div>
            </div>
          </div>

          <!-- GURU -->
          <div class="group group-paket2">
            <button type="button" class="group-btn caret">
              <span class="left">
                <span class="icon">G</span>
                GURU
              </span>
              <span class="chev">▾</span>
            </button>

            <div class="group-menu nested">
              <div class="menu-grid">
                <a class="menu-link" href="/sumatif/kartu_ujian">Cek Kartu Ujian<span>→</span></a>
                <a class="menu-link" href="/sumatif/kartu_pengawas">Kartu Pengawas<span>→</span></a>
                <a class="menu-link" href="/sumatif/absensi">Absensi<span>→</span></a>
                <a class="menu-link" href="/sumatif/berita_acara">Berita Acara<span>→</span></a>
                
              </div>
            </div>
          </div>

        </div>
      </div>

    </div>
  </div>

  <!-- FOOTER -->
  <footer class="footer-minimal">
    <strong>© 2026 SMK Bintang Persada Denpasar</strong>
        <span class="footer-sub">Sistem Informasi Online - SAS GENAP</span>
  </footer>
</div>

<!-- SCRIPT -->
<script>
const ACCESS_TOKEN = "SAS2026";

// Saat halaman dibuka
document.addEventListener("DOMContentLoaded", () => {
  checkAccess();
});

// ====================
// CEK TOKEN
// ====================
function checkAccess() {
  const isAuthorized = sessionStorage.getItem("AUTHORIZED");
  const mainPage = document.getElementById("mainPage");

  if (isAuthorized === "true") {
    showMainPage();
    return;
  }

  Swal.fire({
    title: 'Akses Main Menu',
    text: 'Masukkan token untuk melanjutkan',
    input: 'password',
    inputPlaceholder: 'Masukkan token...',
    allowOutsideClick: false,
    allowEscapeKey: false,
    confirmButtonText: 'Masuk',
    confirmButtonColor: '#2563eb',

    preConfirm: (inputValue) => {
      if (!inputValue) {
        Swal.showValidationMessage('Token tidak boleh kosong');
        return false;
      }

      if (inputValue !== ACCESS_TOKEN) {
        Swal.showValidationMessage('Token salah ❌');
        return false;
      }

      return true;
    }

  }).then((result) => {
    if (result.isConfirmed) {
      sessionStorage.setItem("AUTHORIZED", "true");

      Swal.fire({
        icon: 'success',
        title: 'Akses Diberikan',
        timer: 1000,
        showConfirmButton: false
      }).then(() => {
        showMainPage();
      });
    }
  });
}

// ====================
// TAMPILKAN MENU
// ====================
function showMainPage() {
  document.getElementById("mainPage").style.display = "block";
  initMenu();
}

// ====================
// MENU ACCORDION
// ====================
function initMenu() {
  document.querySelectorAll(".group-btn").forEach(btn => {
    btn.addEventListener("click", function () {
      const currentGroup = this.closest(".group");

      document.querySelectorAll(".group").forEach(group => {
        if (group !== currentGroup) {
          group.classList.remove("open");
          const nested = group.querySelector(".nested");
          if (nested) nested.classList.remove("active");
        }
      });

      currentGroup.classList.toggle("open");
      const currentNested = currentGroup.querySelector(".nested");
      if (currentNested) currentNested.classList.toggle("active");
    });
  });
}
</script>

</body>
</html>
