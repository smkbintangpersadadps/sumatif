<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Absensi Ujian</title>

  <link rel="stylesheet" href="css/style.css">

  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>

<body>

<div class="page-shell">
  <div class="page-content">

    <div class="page-wrap">

      <div class="logo-wrapper">
        <img class="logo" src="https://i.ibb.co.com/sdV75wcH/Logo.png" alt="Logo">
      </div>

      <h3>Absensi Siswa</h3>

      <!-- FILTER -->
      <div class="filter">

        <input type="date" id="tanggal">

        <div class="autocomplete">
          <input
            type="text"
            id="ruangan"
            placeholder="Cari Ruangan..."
            onkeyup="filterRuangan()"
          >

          <div id="ruanganList" class="autocomplete-list"></div>
        </div>

        <button onclick="loadData()">Tampilkan</button>

      </div>

      <!-- INFO -->
      <div class="info" id="infoBox"></div>

      <!-- ACTION -->
      <div class="action">
        <button onclick="setAll('Hadir')">
          ✔ Semua Hadir
        </button>

        <button onclick="setAll('')">
          🔄 Reset
        </button>
      </div>

      <!-- TABLE -->
      <div id="tableContainer"></div>

      <!-- SAVE -->
      <button class="btn-save" onclick="simpan()">
        💾 Simpan
      </button>

    </div>

  </div>
</div>

<!-- LOADING -->
<div id="loading" class="loading">
  <div class="spinner"></div>
  <p>Mohon tunggu sebentar...</p>
</div>

<script src="js/app.js"></script>

</body>
</html>
